[project]
name = "techtree"
version = "0.1.0"
description = "A living technology tree for frontier sectors: what became possible, what is one problem away, and who can solve it."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
techtree = "techtree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["techtree"]
